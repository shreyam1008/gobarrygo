name: Deploy Site

on:
  push:
    branches:
      - "main"
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Cache site node_modules
        id: cache-site-modules
        uses: actions/cache@v5
        with:
          path: site/node_modules
          key: ${{ runner.os }}-site-${{ hashFiles('site/bun.lock', 'site/package.json') }}

      - name: Install dependencies
        if: steps.cache-site-modules.outputs.cache-hit != 'true'
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build with Astro
        working-directory: site
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          bun run verify
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
